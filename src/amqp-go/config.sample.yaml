# AMQP-Go Server Configuration
# Complete configuration file with all available options and their defaults
# Load with: amqp-server --config config.yaml
# Override any setting with environment variables, e.g. AMQP_NETWORK_ADDRESS=0.0.0.0:5672
#
# ============================================================================
# Metadata Caching Architecture
# ============================================================================
#
# All metadata (exchanges, queues, bindings) is cached in memory using lock-free
# sync.Map structures for O(1) lookup performance. This eliminates disk I/O on
# the critical message routing path.
#
# Benefits:
# - Zero disk reads for routing lookups during message publish
# - Lock-free concurrent access for high-throughput routing
# - Warm cache preloaded on startup (all metadata in memory)
# - O(1) binding lookups (previously O(n) disk scans)
#
# Memory Impact:
# - Exchange metadata: ~1-2 KB per exchange
# - Queue metadata: ~1-2 KB per queue
# - Binding metadata: ~500 bytes per binding
# - Typical setup (100 queues, 200 bindings): ~200 KB total
#
# Cached Metadata:
# ✓ Exchanges - All exchange definitions with properties
# ✓ Queues - All queue definitions with properties
# ✓ Bindings - Three-tier cache (individual, queue-indexed, exchange-indexed)
# ✓ Consumers - Lock-free sync.Map in broker
#
# Cache Invalidation:
# - Automatic on create/update/delete operations
# - Persisted to disk atomically (CBOR format for speed)
# - Rebuilt on server restart (warm cache)
#

# ============================================================================
# Network Configuration
# ============================================================================
network:
  # Server bind address (format: "host:port" or ":port").
  # Loopback by default: remote clients need an explicit choice below.
  # Binding 0.0.0.0 exposes the broker to the network; with authentication
  # disabled (the default) anyone can publish/consume/purge, and startup logs
  # a loud security warning.
  address: "127.0.0.1:5672"

  # AMQP protocol port (standard: 5672, TLS: 5671)
  port: 5672

  # Maximum concurrent client connections
  maxconnections: 1000

  # AMQP heartbeat interval (milliseconds, 0 = disabled)
  heartbeatintervalms: 60000  # 60 seconds

  # Enable TCP keep-alive probes
  tcpkeepalive: true

  # TCP keep-alive probe interval (milliseconds)
  tcpkeepaliveintervalms: 30000  # 30 seconds

  # TCP read buffer size (bytes), default 256 KiB
  readbuffersize: 262144

  # TCP write buffer size (bytes), default 256 KiB
  writebuffersize: 262144

  # Publish-inflight lease budget (bytes): bounds DECLARED publish body bytes
  # (plus fixed framing) in flight between the content-header read and
  # durability/return/teardown (WS-I). 0 = default (4 x WAL batch seal =
  # 256 MiB); -1 = disabled; any other value must be >= 1 MiB.
  publishinflightbudgetbytes: 0

# ============================================================================
# Storage Configuration
# ============================================================================
storage:
  # Directory path for persistent storage
  path: ./data

  # Durability of a confirmed message — the single option that names the crash
  # class a publisher confirm is guaranteed to survive (macOS; on Linux and every
  # non-darwin platform barrier and flush both fdatasync per confirmed message —
  # power-loss safe — so barrier vs flush is inert there, but none issues no
  # group-commit barrier at all and is NOT power-loss safe).
  #
  #   none    = no WAL group-commit barrier (the retired fsync: false). A
  #             confirmed message survives the broker staying up but NOT a
  #             process kill. Transactions always fsync.
  #   barrier = fcntl(F_BARRIERFSYNC) (the default): the batch is handed to the
  #             drive under an ordering barrier. Confirmed messages survive
  #             kill -9 and an OS crash; a sudden power loss can lose the most
  #             recent confirmed messages still in the drive's volatile cache
  #             (survivors are a prefix in WAL order).
  #   flush   = fcntl(F_FULLFSYNC): the full drive-cache flush, so confirmed
  #             messages also survive power loss.
  #
  # Omitting this key defaults to barrier. Anything else fails at boot.
  durability: barrier

  # Enable CRC32 integrity checks for WAL/segment records
  # true = compute and verify CRC32 per record (safe, costs ~8% CPU) — the default
  # false = skip CRC computation (write zero, skip verification on read; faster)
  # Omitting this key defaults to CRC ON (safe). Record format is unchanged.
  crccheck: true

  # Message TTL in seconds (0 = no expiration)
  messagettl: 0

  # Metadata cache size in megabytes
  cachemb: 64

  # Maximum number of open file handles
  maxfiles: 100

  # Retention period for old segments (milliseconds)
  # Example: 86400000 = 24 hours
  retentionms: 86400000

# ============================================================================
# Security Configuration
# ============================================================================
security:
  # Enable TLS/SSL encryption (see docs/TLS.md for setup guide)
  tlsenabled: false

  # Path to TLS certificate file (required if TLS enabled, PEM format)
  tlscertfile: ""

  # Path to TLS private key file (required if TLS enabled, PEM format)
  tlskeyfile: ""

  # Path to TLS CA certificate file (optional, enables mutual TLS when set)
  # When set, server requires and verifies client certificates
  tlscafile: ""

  # Enable client authentication
  authenticationenabled: false

  # Authentication backend type ("file" or "ldap")
  authenticationbackend: file

  # Backend-specific authentication configuration
  authenticationconfig: {}

  # Path to authentication credentials file (for file backend)
  authenticationfilepath: ./auth.json

  # Supported SASL authentication mechanisms
  authmechanisms:
    - PLAIN

  # Enable authorization (access control)
  # When enabled, per-operation permission checks are enforced per the
  # RabbitMQ configure/write/read model. See docs/AUTHORIZATION.md
  authorizationenabled: false

  # Default virtual host for connections
  defaultvhost: /

  # Allow/block lists are enforced per connection (403 access-refused).
  # Empty list = no restriction; a blocked entry beats an allowed entry.
  # Host entries: IP literal (10.0.0.5), CIDR (10.0.0.0/8), or "localhost".
  # Hostnames are rejected at startup (matching them would need reverse DNS).
  # There is no implicit loopback exemption: add "localhost" to allowedhosts.
  # User lists apply only when authenticationenabled is true.
  allowedhosts: []
  blockedhosts: []
  allowedusers: []
  blockedusers: []

  # Per-peer failed-authentication limiter: 5 failures per 60s window.
  # 0 disables it. Peers are keyed per IPv4 address / IPv6 /64.
  authfailurelimit: 5
  authfailurewindowms: 60000

# ============================================================================
# Server Configuration
# ============================================================================
server:
  # Server identification name
  name: amqp-go-server

  # Product name
  product: AMQP-Go

  # Platform identifier
  platform: Go

  # Copyright notice
  copyright: Maxpert AMQP-Go Server

  # Logging level (debug, info, warn, error)
  loglevel: info

  # Log file path (empty = stdout)
  logfile: ""

  # PID file path for daemon mode (empty = no PID file)
  pidfile: ""

  # Run as background daemon process
  daemonize: false

  # Maximum channels per client connection (AMQP spec max: 2047)
  maxchannelsperconnection: 2047

  # Maximum AMQP frame size in bytes (default: 128 KB)
  maxframesize: 131072

  # Maximum message size in bytes (default: 16 MB)
  maxmessagesize: 16777216

  # Maximum number of queues (all kinds: durable, transient, exclusive,
  # auto-delete, server-named). Declaring beyond the cap fails with
  # 406 PRECONDITION_FAILED. 0 = unlimited (default).
  maxqueues: 0

  # Maximum number of user-declared exchanges (the default exchange and the
  # built-in amq.* exchanges are not counted). Declaring beyond the cap fails
  # with 406 PRECONDITION_FAILED. 0 = unlimited (default).
  maxexchanges: 0

  # Interval for cleanup tasks (milliseconds)
  cleanupintervalms: 300000  # 5 minutes

# ============================================================================
# Engine Configuration (Performance Tuning)
# Configurable hot-path parameters for performance optimization
# ============================================================================
engine:
  # ========================================
  # Queue State Management
  # ========================================

  # ========================================
  # Publisher Backpressure Depth
  # ========================================

  # Per-queue publisher backpressure depth high-water mark, in MESSAGES: at
  # this many messages in flight (head - min ack cursor) the publisher blocks
  # or spills. 0 = the default 52428.
  #
  # This is a SECONDARY gate: the hot-cache BYTE budget
  # (hotcachequeuebytes) usually binds first.
  maxqueuebacklog: 52428

  # ========================================
  # Write-Ahead Log (WAL)
  # ========================================

  # WAL batch size - how many messages to batch before flushing WAL
  # Larger = better throughput, higher latency, more data loss risk on crash
  # Smaller = lower latency, more fsync calls, lower throughput
  # Default: 1,000 messages
  walbatchsize: 1000

  # Retained for compatibility; not used (flushing is drain-then-flush, not
  # timer-gated). Kept because existing configs spell it.
  # Default: 5 (5ms)
  walbatchtimeoutms: 10

  # Maximum size of each WAL file before rotation (bytes)
  # Larger = fewer files, longer replay on restart
  # Smaller = more files, faster replay, more file handles
  # Default: 536,870,912 (512 MB)
  walfilesize: 536870912

  # WAL channel buffer size - buffered write/ack requests to WAL
  # Larger = more buffering for bursts, more memory
  # Smaller = less memory, potential blocking under load
  # Default: 10,000
  walchannelbuffer: 10000

  # ========================================
  # Segment Storage (Cold Path)
  # ========================================

  # Segment file size - max size of each segment file (bytes)
  # Larger = fewer files, longer compaction time
  # Smaller = more files, faster compaction, more file handles
  # Code default: 67108864 (64 MiB); this sample sets 268435456 (256 MB).
  segmentsize: 268435456

  # Segment checkpoint interval - how often to checkpoint metadata (milliseconds)
  # Longer = less I/O overhead, more replay on restart
  # Shorter = more I/O overhead, faster restart
  # Default: 300000 (5 minutes)
  segmentcheckpointintervalms: 300000

  # Compaction threshold - fraction of deleted messages to trigger compaction (0.0-1.0)
  # Higher = less frequent compaction, more wasted space
  # Lower = more frequent compaction, less wasted space, more I/O
  # Default: 0.5 (50% deleted)
  compactionthreshold: 0.5

  # Compaction interval - how often to check for segments needing compaction (milliseconds)
  # Longer = less overhead checking, slower space reclamation
  # Shorter = more frequent checks, faster space reclamation
  # Default: 1800000 (30 minutes)
  compactionintervalms: 1800000

  # ========================================
  # Consumer Delivery
  # ========================================

  # Consumer select timeout - how long to wait when no messages available (milliseconds)
  # Longer = less CPU spinning, higher latency when messages arrive
  # Shorter = lower latency, more CPU usage
  # Default: 1 (500 microseconds rounded up to 1ms)
  consumerselecttimeoutms: 1

  # Consumer max batch size - max messages to deliver per consumer per poll
  # Larger = better throughput, potential unfairness between consumers
  # Smaller = better fairness, lower throughput
  # Default: 100
  consumermaxbatchsize: 100

  # ========================================
  # Background Maintenance
  # ========================================

  # Interval for WAL cleanup - removing fully-processed WAL files (milliseconds)
  # Longer = slower cleanup, more disk usage
  # Shorter = faster cleanup, more overhead
  # Default: 1000 (1 second)
  walcleanupcheckintervalms: 1000

# ============================================================================
# Resource Alarms (RabbitMQ-style memory/disk pressure)
# ============================================================================
resourcealarms:
  # Dormant by default: no monitor goroutine and no sampling.
  enabled: false
  # Fraction of total RAM that trips the memory alarm (0 disables the arm)
  memoryhighwatermark: 0.4
  # Free disk floor in bytes (0 disables the arm)
  diskfreelimitbytes: 52428800
  # Fractional margin between set and clear thresholds
  hysteresis: 0.05
  # Sampling cadence (milliseconds)
  checkintervalms: 2000

# ============================================================================
# Telemetry (Prometheus /metrics and /health readiness)
# ============================================================================
telemetry:
  # Enable the HTTP endpoint (also --enable-telemetry)
  enabled: false
  # Bind address. Loopback by default; 0.0.0.0 exposes unauthenticated
  # metrics to the network.
  address: 127.0.0.1
  # HTTP port (9419)
  port: 9419
  # Register /debug/pprof/* and enable mutex/block profiling (also
  # --enable-pprof). Heap/goroutine dumps are unauthenticated: loopback only.
  pprofenabled: false

# ============================================================================
# Management (control plane: REST API + embedded web UI)
# ============================================================================
# OFF BY DEFAULT and loopback-only by default (SEC-001/002). Enable with
# management.enabled or the --management flag. The surface refuses to start on
# an unsafe authentication combination rather than degrading silently, and logs
# startup security warnings before it is exposed. See docs/MANAGEMENT.md.
#
# Keys are written in the loader's concatenated spelling (every segment is
# lower-cased and underscores are dropped before binding), matching the rest of
# this file.
management:
  # Enable the management REST API and web UI (default false).
  enabled: false

  # Bind address. Loopback by default; a non-loopback bind without TLS is
  # refused unless deliberately allowed (SEC-110).
  address: "127.0.0.1"

  # HTTP port (RabbitMQ's management default: 15672).
  port: 15672

  # Node name reported by the API ("amqp-go@<hostname>" when empty).
  nodename: ""

  # Authentication: inherit | basic | none.
  #   inherit = reuse the broker's authentication. With broker auth disabled it
  #             additionally requires allowunauthenticated: true and a loopback
  #             bind (AUTH-002/040).
  #   basic   = a single HTTP Basic principal configured under basic.*.
  #   none    = no authentication; loopback bind only (SEC-111).
  authentication: inherit

  # Permit unauthenticated loopback reads ("inherit" mode, broker auth off).
  allowunauthenticated: false
  # Permit unauthenticated loopback topology mutations (AUTH-041).
  allowunauthenticatedmutations: false
  # Permit the connection-close endpoint (AUTH-015).
  allowconnectionclose: false

  # Users granted administrator-equivalent capabilities (tags).
  adminusers: []
  # Reverse proxies whose forwarded client address may be trusted (CIDRs/IPs;
  # an entry that forwards no client address fails closed) (SEC-112).
  trustedproxies: []

  # Single basic-auth principal (used when authentication: basic).
  basic:
    username: ""
    # A bcrypt hash, never a plaintext password (AUTH-003).
    passwordhash: ""
    # Grant this principal administrator-equivalent capabilities (AUTH-042).
    admin: false

  # TLS for the management listener.
  tls:
    enabled: false
    certfile: ""
    keyfile: ""
    # Client mTLS is refused until a certificate-to-identity mapping exists
    # (OQ-015).
    cafile: ""

  # Cross-origin access. Empty means CORS is off; "*" is forbidden (SEC-094).
  cors:
    allowedorigins: []

  # Server-side sessions.
  session:
    # Idle session timeout (seconds; default 28800 = 8 h).
    idletimeoutseconds: 28800
    # Maximum concurrent sessions (default 1024).
    maxsessions: 1024

  # Request/response limits (each must be positive once enabled).
  limits:
    # Largest page size a client may request (default 500).
    maxpagesize: 500
    # Per-request deadline (seconds).
    requesttimeoutseconds: 30
    # Concurrent in-flight requests before shed-load 503s (default 64; SEC-061).
    maxinflight: 64
    # Request body cap for non-import requests (bytes; default 2 MiB).
    maxbodybytes: 2097152
    # Request body cap for definitions imports (bytes; default 20 MiB).
    maximportbodybytes: 20971520
    # Response body cap (bytes; default 4 MiB).
    maxresponsebytes: 4194304
    # Cap on an entity name in bytes (default 256; SEC-085).
    maxnamebytes: 256

  # Fixed-window rate limits (requests per window; 0 = unlimited; SEC-067/068/069).
  rate_limits:
    publish: 0
    get: 0
    purge: 0
    declare: 0
    # One definitions import per principal per N seconds (0 disables; SEC-067).
    definitionsimportseconds: 10

  # Definition-import size caps (0 = unlimited; COMPAT-027).
  definitions:
    maxqueues: 0
    maxexchanges: 0
    maxbindings: 0

  # Async job pool for large snapshot/import operations.
  async:
    # Spill to an async job past this many messages (default 10000).
    messagethreshold: 10000
    # Spill to an async job past this many entities (default 1000).
    entitythreshold: 1000
    # Maximum concurrent async jobs (default 128).
    maxjobs: 128
    # How long a completed job is retained (seconds).
    jobretentionseconds: 3600

  # Message-preview (bulk get) bounds.
  get:
    # Maximum messages one get returns (default 100).
    maxcount: 100

  # Audit log (non-destructive records may drop; destructive never do; SEC-084).
  audit:
    logfile: ""

