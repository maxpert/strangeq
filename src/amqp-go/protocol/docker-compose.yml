version: '3.8'

services:
  rabbitmq:
    # Must match the tag the conformance path pins (src/amqp-go/Makefile:49) and
    # the version the locked wire values were captured against (RabbitMQ 4.3.2):
    # the conformance suite compares against real broker behaviour, so a stale
    # major here silently invalidates the comparison.
    image: rabbitmq:4-management
    container_name: rabbitmq-test
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amqp-test

networks:
  amqp-test:
    driver: bridge
